name: Label OpenCode PRs

# PRs opened by the OpenCode agent use the owner's PAT, so the PR author is a
# human. Identify them by the agent's commit identity (set in
# k8s/apps/opencode/configmap.yaml) or its agent/* branch prefix instead.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  label:
    name: Label OpenCode PRs
    # Same-repo PRs only; fork PRs get a read-only token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      AGENT_EMAIL: opencode-agent@users.noreply.github.com
    steps:
      - name: Label if generated by OpenCode
        run: |
          agent_commits=$(gh pr view "$PR" --json commits \
            --jq "[.commits[].authors[].email | select(. == \"$AGENT_EMAIL\")] | length")
          if [[ "$HEAD_REF" != agent/* && "$agent_commits" == 0 ]]; then
            echo "Not an OpenCode PR."
            exit 0
          fi
          gh label create opencode --color 5319E7 \
            --description "Generated by the OpenCode background agent" 2>/dev/null || true
          gh pr edit "$PR" --add-label opencode
