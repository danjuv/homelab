name: Build OpenCode image

on:
  push:
    branches: [main]
    paths:
      - images/opencode/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelversion
      - .github/workflows/build-opencode.yaml
  pull_request:
    paths:
      - images/opencode/**
      - MODULE.bazel
      - MODULE.bazel.lock
      - .bazelversion
      - .github/workflows/build-opencode.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenCode image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Check apko lock is current
        run: |
          bazel run //images/opencode:base.lock
          git diff --exit-code -- images/opencode/apko.lock.json \
            || { echo "::warning::apko.lock.json is stale (new Wolfi packages); building with the committed lock"; git checkout -- images/opencode/apko.lock.json; }

      - name: Build image
        run: bazel build //images/opencode:image

      - name: Read OpenCode version
        id: version
        run: |
          version=$(sed -n 's/^OPENCODE_VERSION = "\(.*\)"$/\1/p' MODULE.bazel)
          test -n "$version"
          echo "opencode=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          bazel run //images/opencode:push -- \
            --tag "${{ steps.version.outputs.opencode }}" \
            --tag "${{ steps.version.outputs.opencode }}-${{ steps.version.outputs.short_sha }}"
