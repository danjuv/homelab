apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-arr
  namespace: argocd
spec:
  project: default
  sources:
    - chart: app-template
      repoURL: oci://ghcr.io/bjw-s-labs/helm/app-template
      targetRevision: 5.2.1
      helm:
        releaseName: mcp-arr
        valueFiles:
          - $values/k8s/apps/mcp-arr/values.yaml
    - repoURL: git@github.com:danjuv/homelab.git
      targetRevision: HEAD
      ref: values
      path: k8s/apps/mcp-arr
      directory:
        include: "{networkpolicy.yaml,sealedsecret.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
