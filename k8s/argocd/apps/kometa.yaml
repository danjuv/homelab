apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kometa
  namespace: argocd
spec:
  project: default
  sources:
    - chart: app-template
      repoURL: oci://ghcr.io/bjw-s-labs/helm/app-template
      targetRevision: 5.2.1
      helm:
        releaseName: kometa
        valueFiles:
          - $values/k8s/apps/kometa/values.yaml
    - repoURL: git@github.com:danjuv/homelab.git
      targetRevision: HEAD
      ref: values
      path: k8s/apps/kometa
      directory:
        include: "sealedsecret.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
