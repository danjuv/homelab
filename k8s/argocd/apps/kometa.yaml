apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kometa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:danjuv/homelab.git
    targetRevision: HEAD
    path: k8s/apps/kometa/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
