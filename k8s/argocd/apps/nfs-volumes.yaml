apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-volumes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:danjuv/homelab.git
    targetRevision: HEAD
    path: k8s/admin/nfs-volumes
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
