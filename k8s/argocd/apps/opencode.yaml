apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode
  namespace: argocd
spec:
  project: default
  # Plain manifests: agent ServiceAccount/RBAC, agent files, SealedSecret.
  source:
    repoURL: git@github.com:danjuv/homelab.git
    targetRevision: HEAD
    path: k8s/apps/opencode
  destination:
    server: https://kubernetes.default.svc
    namespace: opencode
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
