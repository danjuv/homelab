apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  sources:
    - chart: authelia
      repoURL: https://charts.authelia.com
      targetRevision: 0.11.22
      helm:
        releaseName: authelia
        valueFiles:
          - $values/k8s/admin/authelia/values.yaml
    - repoURL: git@github.com:danjuv/homelab.git
      targetRevision: HEAD
      ref: values
      path: k8s/admin/authelia
      directory:
        include: "{sealedsecret.yaml,users.sealedsecret.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
