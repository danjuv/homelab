apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default
  sources:
    - chart: app-template
      repoURL: oci://ghcr.io/bjw-s-labs/helm/app-template
      targetRevision: 5.3.0
      helm:
        releaseName: garage
        valueFiles:
          - $values/k8s/apps/garage/values.yaml
    - repoURL: git@github.com:danjuv/homelab.git
      targetRevision: HEAD
      ref: values
      path: k8s/apps/garage
      directory:
        include: "{networkpolicy.yaml,sealedsecret.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
