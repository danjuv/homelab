provider:
  name: pihole
env:
  - name: EXTERNAL_DNS_PIHOLE_SERVER
    value: "http://192.168.50.71:8182"
  - name: EXTERNAL_DNS_PIHOLE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: external-dns-pihole
        key: password
extraArgs:
  - --pihole-api-version=6
policy: sync
sources:
  - ingress