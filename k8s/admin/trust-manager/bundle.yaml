apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: homelab-ca-bundle
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: homelab-ca-secret
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.crt
