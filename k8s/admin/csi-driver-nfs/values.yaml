storageClass:
  create: true
  name: synology-nas-csi
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  parameters:
    server: "192.168.50.80"
    share: "/volume1/k8s"
  reclaimPolicy: Retain
  volumeBindingMode: Immediate
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
    - nolock
    - mountproto=tcp
