api:
  host: kargo.home.lab

  # TLS is terminated at the ingress-nginx controller, so the API server itself
  # serves plain HTTP. terminatedUpstream forces Kargo to advertise https:// URLs.
  tls:
    enabled: false
    terminatedUpstream: true

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      # cert-manager issues the cert via the ingress annotation above, so the
      # chart must not generate its own self-signed cert.
      selfSignedCert: false
      secretName: kargo-homelab-tls

  # Admin credentials (ADMIN_ACCOUNT_PASSWORD_HASH and
  # ADMIN_ACCOUNT_TOKEN_SIGNING_KEY) are supplied out-of-band via a SealedSecret.
  secret:
    name: kargo-admin

  # Enables deep links back to Argo CD from the Kargo UI.
  argocd:
    urls:
      "": https://argocd.home.lab

# The external webhooks server shares the API's ingress (on the /webhooks path),
# so it must also terminate TLS at the ingress to keep a single HTTP backend.
externalWebhooksServer:
  host: kargo.home.lab
  tls:
    enabled: false
    terminatedUpstream: true

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd
