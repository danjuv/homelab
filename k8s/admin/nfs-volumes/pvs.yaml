apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-downloads-sonarr
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-downloads-sonarr
    volumeAttributes:
      server: "192.168.50.80"
      share: "/volume1/downloads"
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
    - nolock
    - mountproto=tcp
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-tv-shows-sonarr
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-tv-shows-sonarr
    volumeAttributes:
      server: "192.168.50.80"
      share: "/volume1/tv_shows"
  mountOptions:
    - nfsvers=3
    - hard
    - noatime
    - nolock
    - mountproto=tcp
