controllers:
  main:
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.17
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Australia/Sydney"

service:
  main:
    controller: main
    ports:
      http:
        port: 8989

ingress:
  main:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    hosts:
      - host: sonarr-k8s.home.lab
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 3Gi
    storageClass: longhorn
    globalMounts:
      - path: /config
  downloads:
    type: persistentVolumeClaim
    existingClaim: nfs-downloads
    globalMounts:
      - path: /downloads
  tv:
    type: persistentVolumeClaim
    existingClaim: nfs-tv-shows
    globalMounts:
      - path: /tv
