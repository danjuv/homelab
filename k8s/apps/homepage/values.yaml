image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.2.0

enableRbac: true

ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      - secretName: homepage-homelab-tls
        hosts:
          - home.lab
    hosts:
      - host: home.lab
        paths:
          - path: /
            pathType: Prefix

config:
  bookmarks: []
  services:
    - Media:
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.home.lab
            description: TV Shows
            widget:
              type: sonarr
              url: http://sonarr.media:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            icon: radarr.png
            href: https://radarr.home.lab
            description: Movies
            widget:
              type: radarr
              url: http://radarr.media:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.home.lab
            description: Indexer Manager
            widget:
              type: prowlarr
              url: http://prowlarr.media:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - qBittorrent:
            icon: qbittorrent.png
            href: https://qbt.home.lab
            description: Downloads
            widget:
              type: qbittorrent
              url: http://qbittorrent-main.media:8080
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USER}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASS}}"
    - Monitoring:
        - Tautulli:
            icon: tautulli.png
            href: https://tautulli.home.lab
            description: Plex Monitoring
            widget:
              type: tautulli
              url: http://tautulli.media:8181
              key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
        - Overseerr:
            icon: overseerr.png
            href: https://overseerr.home.lab
            description: Media Requests
            widget:
              type: seerr
              url: http://seer-seerr-chart.media:80
              key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Infrastructure:
        - ArgoCD:
            icon: sh-argocd
            href: https://argocd.home.lab
            description: GitOps
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.home.lab
            description: Storage
  widgets:
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
    - search:
        provider: google
        target: _blank
  kubernetes:
    mode: cluster
  settings:
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system:80
    title: Homelab
    headerStyle: clean
    layout:
      Media:
        style: row
        columns: 4
      Monitoring:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 2

envFrom:
  - secretRef:
      name: homepage-secrets

env:
  HOMEPAGE_ALLOWED_HOSTS: home.lab
