image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.5.0

enableRbac: true

ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      - secretName: homepage-homelab-tls
        hosts:
          - home.lab
    hosts:
      - host: home.lab
        paths:
          - path: /
            pathType: Prefix

config:
  bookmarks: []
  # One group per domain. `href` is the public HTTPS ingress host from the
  # app's own values file; `widget.url` and `providers` stay on in-cluster
  # Service DNS and must not be rewritten to the public host. See README.md.
  services:
    - Media:
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.home.lab
            description: TV Shows
            widget:
              type: sonarr
              url: http://sonarr.media:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Radarr:
            icon: radarr.png
            href: https://radarr.home.lab
            description: Movies
            widget:
              type: radarr
              url: http://radarr.media:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.home.lab
            description: Indexer Manager
            widget:
              type: prowlarr
              url: http://prowlarr.media:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - qBittorrent:
            icon: qbittorrent.png
            href: https://qbt.home.lab
            description: Downloads
            widget:
              type: qbittorrent
              url: http://qbittorrent-main.media:8080
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USER}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASS}}"
        # The app is called Seerr now, but its ingress host is still
        # overseerr.home.lab (k8s/apps/seer/values.yaml). Keep the href on the
        # real host; only the display name and icon were renamed.
        - Seerr:
            icon: seerr.png
            href: https://overseerr.home.lab
            description: Media Requests
            widget:
              type: seerr
              url: http://seer-seerr-chart.media:80
              key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
        - Tautulli:
            icon: tautulli.png
            href: https://tautulli.home.lab
            description: Plex Monitoring
            widget:
              type: tautulli
              url: http://tautulli.media:8181
              key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
    - Home:
        - Home Assistant:
            icon: home-assistant.png
            href: https://homeassistant.home.lab
            description: Home Automation
    - AI:
        - Open WebUI:
            icon: open-webui.png
            href: https://chat.home.lab
            description: AI Chat
        - Hermes:
            icon: sh-hermes-agent
            href: https://hermes.home.lab
            description: AI Agent
        - Hindsight:
            icon: hindsight.png
            href: https://hindsight.home.lab
            description: Agent Memory
    - Infrastructure:
        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.home.lab
            description: GitOps
        - Argo Workflows:
            icon: si-argo
            href: https://argo-workflows.home.lab
            description: Workflow Engine
        - Kargo:
            href: https://kargo.home.lab
            description: Release Promotion
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.home.lab
            description: Storage
  widgets:
    # `kubernetes` already reports cluster and per-node CPU/memory, so the
    # separate `resources` widget (also backend: kubernetes) was redundant.
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
    - search:
        provider: google
        target: _blank
  kubernetes:
    mode: cluster
  settings:
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system:80
    title: Homelab
    headerStyle: clean
    useEqualHeights: true
    layout:
      # Media has six cards; three columns lay them out as two even rows.
      Media:
        style: row
        columns: 3
      Home:
        style: row
        columns: 4
      AI:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4

envFrom:
  - secretRef:
      name: homepage-secrets

env:
  HOMEPAGE_ALLOWED_HOSTS: home.lab
