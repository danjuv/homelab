apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arr-mcp
  namespace: arr-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: arr-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
              app.kubernetes.io/component: open-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opencode-task
      ports:
        - protocol: TCP
          port: 6060
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: sonarr
      ports:
        - protocol: TCP
          port: 8989
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: radarr
      ports:
        - protocol: TCP
          port: 7878
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: prowlarr
      ports:
        - protocol: TCP
          port: 9696
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: qbittorrent
      ports:
        - protocol: TCP
          port: 8080
