apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp-server
  namespace: kubernetes-mcp-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kubernetes-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: open-webui
              app.kubernetes.io/component: open-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-agent
      ports:
        - protocol: TCP
          port: 8080
