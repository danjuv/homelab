ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      - secretName: tautulli-homelab-tls
        hosts:
          - tautulli.home.lab
    hosts:
      - host: tautulli.home.lab
        path: /
        pathType: Prefix
persistence:
  config:
    enabled: true
    mountPath: "/config"
    size: 4Gi
    storageClass: longhorn
