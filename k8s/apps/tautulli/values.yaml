ingress:
  main:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    hosts:
      - host: tautulli.home.lab
        path: /
        pathType: Prefix
persistence:
  config:
    enabled: true
    mountPath: "/config"
    size: 1Gi
    storageClass: longhorn
