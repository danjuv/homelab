controllers:
  main:
    enabled: false

configMaps:
  config:
    data:
      config.yml: |
        libraries:
          Films:
            operations:
              # Critic rating from Metacritic (via MDBList), audience rating
              # from IMDb, and the Rotten Tomatoes audience score into the Plex
              # user rating (both MDBList ratings need the mdblist block below).
              mass_critic_rating_update: mdb_metacritic
              mass_audience_rating_update: imdb
              mass_user_rating_update: mdb_tomatoesaudience
            collection_files:
              - default: imdb
              - default: myanimelist
            overlay_files:
              - default: resolution
              - default: audio_codec
              - default: ratings
                template_variables:
                  rating1: imdb
                  rating1_image: imdb
          TV shows:
            operations:
              # Critic rating from Metacritic (via MDBList), audience rating
              # from IMDb, and the Rotten Tomatoes audience score into the Plex
              # user rating (both MDBList ratings need the mdblist block below).
              mass_critic_rating_update: mdb_metacritic
              mass_audience_rating_update: imdb
              mass_user_rating_update: mdb_tomatoesaudience
            collection_files:
              - default: imdb
              - default: myanimelist
            overlay_files:
              - default: resolution
              - default: ratings
                template_variables:
                  rating1: imdb
                  rating1_image: imdb
              # MyAnimeList rating overlay for anime only. The built-in
              # "ratings" default cannot be filtered, so this is a separate
              # file that selects the Anime genre itself and sits in its own
              # (un-grouped) overlay so it does not compete with the IMDb one.
              - file: config/anime-overlays.yml
        settings:
          cache: true
          cache_expiration: 60
          asset_directory: config/assets
          asset_folders: true
          create_asset_folders: false
          sync_mode: append
          minimum_items: 1
          delete_below_minimum: true
          run_again_delay: 2
          show_unmanaged: true
          show_missing: true
          save_report: false
          tvdb_language: eng
          playlist_sync_to_users: all
          verify_ssl: true
        plex:
          # Plex runs on the control-plane host. Its Tailscale IP is not
          # reachable from pods.
          url: http://192.168.50.71:32400
          # KOMETA_PLEX_TOKEN is reserved by Kometa and is not available as
          # <<PLEX_TOKEN>>; the literal "env" makes Kometa use it.
          token: env
          timeout: 60
          clean_bundles: false
          empty_trash: false
          optimize: false
        # Kometa refuses to start without TMDb; it uses it internally to map
        # IMDb/MAL IDs to Plex items. No TMDb collections are configured.
        tmdb:
          apikey: <<TMDB_APIKEY>>
          language: en
        # MDBList supplies the Metacritic critic score and the Rotten Tomatoes
        # audience score used by the mass_critic_rating_update and
        # mass_user_rating_update operations. The KOMETA_MDBLIST_APIKEY secret
        # key does not exist yet; until it is added Kometa logs a config error
        # and skips only those operations, leaving the IMDb audience update in
        # place.
        mdblist:
          apikey: <<MDBLIST_APIKEY>>
        mal:
          client_id: <<MAL_CLIENT_ID>>
          client_secret: <<MAL_CLIENT_SECRET>>
          # Bootstrap tokens; render-config keeps Kometa's refreshed ones.
          authorization:
            access_token: <<MAL_ACCESS_TOKEN>>
            token_type: Bearer
            expires_in: 2678400
            refresh_token: <<MAL_REFRESH_TOKEN>>
      # Custom overlay file mounted at /config by render-config.py and
      # referenced from the TV shows library via `file: config/anime-overlays.yml`.
      # Standalone (no overlay group) so it layers on top of the IMDb rating
      # overlay instead of replacing it. `filters` is evaluated on Plex
      # metadata, `value_filter` on the MAL rating fetched at run time.
      anime-overlays.yml: |
        overlays:
          AnimeMALRating:
            overlay:
              name: text(<<mal_rating>>)
              default: rating/MAL
              font: fonts/Inter-Bold.ttf
              font_size: 63
              font_color: "#FFFFFF"
              back_color: "#00000099"
              back_radius: 30
              back_width: 160
              back_height: 160
              back_padding: 15
              addon_offset: 15
              addon_position: top
              horizontal_align: right
              horizontal_offset: 20
              vertical_align: bottom
              vertical_offset: 20
            plex_all: true
            filters:
              genre: Anime
            value_filter:
              mal_rating.gte: 0.1
      render-config.py: |
        import hashlib
        import os
        from pathlib import Path

        from ruamel.yaml import YAML

        yaml = YAML()
        live = Path("/config/config.yml")
        marker = Path("/config/.mal-bootstrap")
        config = yaml.load(Path("/seed/config.yml").read_text())
        sealed = hashlib.sha256(os.environ["KOMETA_MAL_REFRESH_TOKEN"].encode()).hexdigest()

        auth = None
        if live.is_file() and marker.is_file() and marker.read_text().strip() == sealed:
            previous = yaml.load(live.read_text()) or {}
            auth = (previous.get("mal") or {}).get("authorization")
            if not auth or str(auth.get("refresh_token", "")).startswith("<<"):
                auth = None
        if auth:
            config["mal"]["authorization"] = auth
            print("Reusing MAL authorization refreshed by a previous run")
        else:
            print("Using sealed MAL bootstrap authorization")

        tmp = live.with_name(".config.yml.tmp")
        with tmp.open("w") as f:
            yaml.dump(config, f)
        tmp.chmod(0o600)
        tmp.replace(live)
        marker.write_text(sealed + "\n")

        # Copy any other seed YAML (e.g. custom overlay files) into /config.
        for source in Path("/seed").glob("*.yml"):
            if source.name != "config.yml":
                live.with_name(source.name).write_text(source.read_text())
                print(f"Wrote {source.name} to /config")

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
