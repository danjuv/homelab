controllers:
  main:
    enabled: false

configMaps:
  config:
    data:
      config.yml: |
        libraries:
          Films:
            collection_files:
              - default: imdb
              - default: myanimelist
            overlay_files:
              - default: resolution
              - default: audio_codec
              - default: ratings
                template_variables:
                  rating1: imdb
                  rating1_image: imdb
                  rating2: mal
                  rating2_image: mal
                  rating3: mdb_tomatoes
                  rating3_image: rt_tomato
          TV shows:
            collection_files:
              - default: imdb
              - default: myanimelist
            overlay_files:
              - default: resolution
              - default: ratings
                template_variables:
                  rating1: imdb
                  rating1_image: imdb
                  rating2: mal
                  rating2_image: mal
              # MyAnimeList overlay for season posters, in addition to the
              # show-level overlay above. The built-in "ratings" default cannot
              # do seasons: its run_this rule skips every source except `user`
              # and `tmdb` at season level, and the direct `mal` source is not
              # defined for seasons at all. The season-level MyAnimeList score
              # is reachable through MDBList as `mdb_myanimelist_rating`, so this is a
              # standalone overlay (no group) that layers the MAL badge onto
              # seasons that have one.
              - file: config/season-overlays.yml
        settings:
          cache: true
          cache_expiration: 60
          asset_directory: config/assets
          asset_folders: true
          create_asset_folders: false
          sync_mode: append
          minimum_items: 1
          delete_below_minimum: true
          run_again_delay: 2
          show_unmanaged: true
          show_missing: true
          save_report: false
          tvdb_language: eng
          playlist_sync_to_users: all
          verify_ssl: true
        plex:
          # Plex runs on the control-plane host. Its Tailscale IP is not
          # reachable from pods.
          url: http://192.168.50.71:32400
          # KOMETA_PLEX_TOKEN is reserved by Kometa and is not available as
          # <<PLEX_TOKEN>>; the literal "env" makes Kometa use it.
          token: env
          timeout: 60
          clean_bundles: false
          empty_trash: false
          optimize: false
        # Kometa refuses to start without TMDb; it uses it internally to map
        # IMDb/MAL IDs to Plex items. No TMDb collections are configured.
        tmdb:
          apikey: <<TMDB_APIKEY>>
          language: en
        mal:
          client_id: <<MAL_CLIENT_ID>>
          client_secret: <<MAL_CLIENT_SECRET>>
          # Bootstrap tokens; render-config keeps Kometa's refreshed ones.
          authorization:
            access_token: <<MAL_ACCESS_TOKEN>>
            token_type: Bearer
            expires_in: 2678400
            refresh_token: <<MAL_REFRESH_TOKEN>>
        # Supplies the Rotten Tomatoes critic rating (mdb_tomatoes) shown in
        # rating3 of the Films ratings overlay. Key is already sealed in the
        # kometa SealedSecret as KOMETA_MDBLIST_APIKEY.
        mdblist:
          apikey: <<MDBLIST_APIKEY>>
          cache_expiration: 60
      render-config.py: |
        import hashlib
        import os
        from pathlib import Path

        from ruamel.yaml import YAML

        yaml = YAML()
        live = Path("/config/config.yml")
        marker = Path("/config/.mal-bootstrap")
        config = yaml.load(Path("/seed/config.yml").read_text())
        sealed = hashlib.sha256(os.environ["KOMETA_MAL_REFRESH_TOKEN"].encode()).hexdigest()

        auth = None
        if live.is_file() and marker.is_file() and marker.read_text().strip() == sealed:
            previous = yaml.load(live.read_text()) or {}
            auth = (previous.get("mal") or {}).get("authorization")
            if not auth or str(auth.get("refresh_token", "")).startswith("<<"):
                auth = None
        if auth:
            config["mal"]["authorization"] = auth
            print("Reusing MAL authorization refreshed by a previous run")
        else:
            print("Using sealed MAL bootstrap authorization")

        tmp = live.with_name(".config.yml.tmp")
        with tmp.open("w") as f:
            yaml.dump(config, f)
        tmp.chmod(0o600)
        tmp.replace(live)
        marker.write_text(sealed + "\n")

        # Copy any other seed YAML (e.g. custom overlay files) into /config.
        for source in Path("/seed").glob("*.yml"):
            if source.name != "config.yml":
                live.with_name(source.name).write_text(source.read_text())
                print(f"Wrote {source.name} to /config")
      # Custom overlay file copied to /config by render-config.py and pulled
      # into the TV shows library via `file: config/season-overlays.yml`.
      # Standalone (no overlay group) so it layers on top of the show-level
      # rating overlays instead of replacing them. `builder_level: season`
      # reads the parent show's MyAnimeList score through MDBList, because the
      # direct `mal` source is not defined at season level; value_filter drops
      # seasons whose show has no MyAnimeList score.
      season-overlays.yml: |
        overlays:
          SeasonMALRating:
            builder_level: season
            overlay:
              name: text(<<mdb_myanimelist_rating>>)
              default: rating/MAL
              font: fonts/Inter-Bold.ttf
              font_size: 63
              font_color: "#FFFFFF"
              back_color: "#00000099"
              back_radius: 30
              back_width: 160
              back_height: 160
              back_padding: 15
              addon_offset: 15
              addon_position: top
              horizontal_align: right
              horizontal_offset: 20
              vertical_align: bottom
              vertical_offset: 20
            plex_all: true
            value_filter:
              mdb_myanimelist_rating.gte: 0.1

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
