# *arr MCP server (Streamable HTTP at
# http://mcp-arr.media.svc.cluster.local:3000/mcp and https://mcp-arr.home.lab/mcp).
# https://github.com/aplaceforallmystuff/mcp-arr
# Talks to Sonarr, Radarr and Prowlarr over their in-cluster services with the
# API keys from sealedsecret.yaml. Lidarr is not deployed, so it is left unset.
#
# The MCP endpoint has no auth and exposes write tools (add series/movies,
# trigger searches, delete queue items). networkpolicy.yaml limits callers to
# ingress-nginx (tailnet only) and the in-cluster agent pods.
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/aplaceforallmystuff/mcp-arr
          tag: 1.7.3
          digest: sha256:ace72c56448e8695e1d2d060e7437470e3f883fcc9316f1294e3a7f682e1efa1
        env:
          MCP_TRANSPORT: http
          HOST: 0.0.0.0
          PORT: "3000"
          MCP_PATH: /mcp
          SONARR_URL: http://sonarr.media.svc.cluster.local:8989
          RADARR_URL: http://radarr.media.svc.cluster.local:7878
          PROWLARR_URL: http://prowlarr.media.svc.cluster.local:9696
        envFrom:
          # SONARR_API_KEY, RADARR_API_KEY, PROWLARR_API_KEY.
          - secretRef:
              name: mcp-arr
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              failureThreshold: 3

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

ingress:
  main:
    className: nginx
    annotations:
      # Streamable HTTP may hold SSE streams open.
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      - secretName: mcp-arr-homelab-tls
        hosts:
          - mcp-arr.home.lab
    hosts:
      - host: mcp-arr.home.lab
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
