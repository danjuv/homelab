# PLACEHOLDER: the encryptedData values below are not real ciphertext and will
# not unseal. Replace them before merging, e.g.:
#   kubectl create secret generic mcp-arr -n media --dry-run=client -o yaml \
#     --from-literal=SONARR_API_KEY=... \
#     --from-literal=RADARR_API_KEY=... \
#     --from-literal=PROWLARR_API_KEY=... \
#   | kubeseal -o yaml > k8s/apps/mcp-arr/sealedsecret.yaml
# Keys come from each app's Settings > General > Security.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mcp-arr
  namespace: media
spec:
  encryptedData:
    SONARR_API_KEY: REPLACE_WITH_SEALED_SONARR_API_KEY
    RADARR_API_KEY: REPLACE_WITH_SEALED_RADARR_API_KEY
    PROWLARR_API_KEY: REPLACE_WITH_SEALED_PROWLARR_API_KEY
  template:
    metadata:
      name: mcp-arr
      namespace: media
    type: Opaque
