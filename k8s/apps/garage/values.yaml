defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    replicas: 1
    strategy: Recreate
    containers:
      main:
        image:
          repository: dxflrs/garage
          tag: v2.4.1
          digest: sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
        envFrom:
          - secretRef:
              name: garage-secrets
              optional: true
        ports:
          - containerPort: 3900
            name: s3
          - containerPort: 3901
            name: rpc
          - containerPort: 3903
            name: admin
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 3900
              periodSeconds: 30
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 3900
              periodSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 3900
              periodSeconds: 5
              failureThreshold: 30

configMaps:
  config:
    data:
      garage.toml: |
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "lmdb"
        replication_factor = 1

        rpc_bind_addr = "[::]:3901"

        [s3_api]
        s3_region = "garage"
        api_bind_addr = "[::]:3900"

        [admin]
        api_bind_addr = "[::]:3903"

persistence:
  config:
    type: configMap
    identifier: config
    advancedMounts:
      main:
        main:
          - path: /etc/garage.toml
            subPath: garage.toml
            readOnly: true
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn
    globalMounts:
      - path: /var/lib/garage
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      s3:
        port: 3900
      admin:
        port: 3903
