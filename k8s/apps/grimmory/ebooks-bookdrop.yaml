# Shared BookDrop intake; also mounted by Shelfmark.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebooks-bookdrop
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: synology-nas-csi
  resources:
    requests:
      storage: 50Gi
