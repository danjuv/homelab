apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
helmCharts:
  - name: grimmory
    repo: oci://ghcr.io/grimmory-tools/helm-charts
    version: 3.5.0
    releaseName: grimmory
    namespace: media
    valuesFile: values.yaml
resources:
  - kobo-ingress.yaml
  - sealedsecret.yaml
  - pvcs.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: grimmory
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
