# "Controls" dashboard. Managed in git (read-only in the UI): edit this file
# and refresh the page after Argo CD syncs. Card reference:
# https://www.home-assistant.io/dashboards/
title: Controls
views:
  # Auto-generated, same as the built-in Overview (Home) dashboard: areas,
  # summaries and devices update themselves as devices are added or moved.
  - title: Overview
    path: overview
    icon: mdi:home
    strategy:
      type: home-overview

  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Entertainment room
            icon: mdi:sofa
          - type: button
            name: LEDs only
            icon: mdi:led-strip-variant
            show_state: false
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.leds_only
          - type: button
            name: Lights only
            icon: mdi:ceiling-light
            show_state: false
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.entertainment_room_lights_only
          - type: button
            name: All lights
            icon: mdi:lightbulb-group
            show_state: false
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.entertainment_room_all_lights
          - type: button
            name: All off
            icon: mdi:lightbulb-group-off
            show_state: false
            grid_options:
              columns: 3
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.lights_off
          - type: tile
            entity: light.tv_2
            name: TV light
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.stairs_light_2
            name: Stairs
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.tv_led_2_2
            name: TV LED left
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.tv_led_1
            name: TV LED right
            features_position: bottom
            features:
              - type: light-brightness

      - type: grid
        cards:
          - type: heading
            heading: Rooms
            icon: mdi:home
          - type: tile
            entity: light.danjubedroom
            name: Danju's bedroom
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.signify_netherlands_b_v_lwa028
            name: Entrance
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.pantry
            name: Kitchen (pantry)
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.office_light
            name: Office
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.signify_netherlands_b_v_lwa028_2
            name: Office wardrobe
            features_position: bottom
            features:
              - type: light-brightness

      - type: grid
        cards:
          - type: heading
            heading: Garage
            icon: mdi:garage
          - type: tile
            entity: light.garage_light_1_2
            name: Garage 1
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.garage_light_2_2
            name: Garage 2
            features_position: bottom
            features:
              - type: light-brightness

  - title: Aircon
    path: aircon
    icon: mdi:air-conditioner
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Aircon
            icon: mdi:air-conditioner
          - type: tile
            entity: climate.daikinap98108
            name: Aircon
            grid_options:
              columns: full
            features:
              - type: climate-hvac-modes
                style: icons
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - dry
                  - fan_only
              - type: target-temperature
          - type: tile
            entity: switch.daikinap98108_upstairs
            name: Upstairs
            icon: mdi:home-floor-1
          - type: tile
            entity: switch.daikinap98108_downstairs
            name: Downstairs
            icon: mdi:home-floor-g

      - type: grid
        cards:
          - type: heading
            heading: Run for...
            icon: mdi:timer-outline
          - type: tile
            entity: timer.aircon
            name: Time left
            grid_options:
              columns: full
          - type: button
            name: 30 min
            icon: mdi:timer-outline
            show_state: false
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.aircon_on_for
              data:
                duration:
                  minutes: 30
          - type: button
            name: 1 hour
            icon: mdi:timer-outline
            show_state: false
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.aircon_on_for
              data:
                duration:
                  hours: 1
          - type: button
            name: 2 hours
            icon: mdi:timer-outline
            show_state: false
            grid_options:
              columns: 4
            tap_action:
              action: perform-action
              perform_action: script.aircon_on_for
              data:
                duration:
                  hours: 2
          - type: button
            name: Turn off now
            icon: mdi:power
            show_state: false
            grid_options:
              columns: full
            tap_action:
              action: perform-action
              perform_action: climate.turn_off
              target:
                entity_id: climate.daikinap98108
              confirmation:
                text: Turn the aircon off?

      # The Daikin doesn't report temperatures; these come from the Hue motion
      # sensors and the office sensor.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Room temperatures
            icon: mdi:thermometer
          - type: tile
            entity: sensor.signify_netherlands_b_v_sml003_temperature_2
            name: Danju's bedroom
          - type: tile
            entity: sensor.temperature_sensor_temperature
            name: Office
          - type: tile
            entity: sensor.wardrobe_temperature
            name: Wardrobe
          - type: tile
            entity: sensor.signify_netherlands_b_v_sml003_temperature
            name: Entrance
          - type: tile
            entity: sensor.signify_netherlands_b_v_sml003_temperature_3
            name: Kitchen
          - type: tile
            entity: sensor.upstairs_motion_sensor_temperature_2
            name: Garage
