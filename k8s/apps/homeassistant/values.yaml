# Values for the upstream pajikos/home-assistant chart (wrapped by Chart.yaml).
home-assistant:
  env:
    - name: TZ
      value: Australia/Sydney

  # Enable for mDNS/SSDP auto-discovery (HomeKit, Chromecast, etc.)
  hostNetwork: false

  # The Sonoff Zigbee dongle (ZHA) is plugged into this node.
  nodeSelector:
    kubernetes.io/hostname: danjeon-ms-7d42

  # Required to open the serial device (not in the runtime's default device allowlist).
  securityContext:
    privileged: true

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: longhorn

  configuration:
    enabled: true
    # Written to /config/configuration.yaml only if the file is missing. All
    # other YAML (automations, scripts, scenes...) lives in config/packages/;
    # after a sync, apply it with Developer tools > YAML > Reload all.
    templateConfig: |-
      default_config:

      homeassistant:
        packages: !include_dir_named gitops/packages

  additionalVolumes:
    # Mounted as a directory (no subPath) so updates reach the running pod.
    - name: gitops-packages
      configMap:
        name: ha-gitops-packages
    # Automation blueprints from config/blueprints/<ns>/, mounted per file
    # (subPath): HA's blueprint scan would otherwise list the hidden ..<ts>/
    # copies in a ConfigMap directory mount. Changes need a pod restart.
    - name: blueprints-blackshome
      configMap:
        name: ha-blueprints-blackshome
    - name: blueprints-homeassistant
      configMap:
        name: ha-blueprints-homeassistant
    # Stable by-id path, exposed as /dev/ttyUSB0 (the path ZHA is configured with).
    - name: zigbee
      hostPath:
        path: /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_9c27ebd30374ef118891c074d9b539e6-if00-port0
        type: CharDevice
  additionalMounts:
    - name: gitops-packages
      mountPath: /config/gitops/packages
      readOnly: true
    - name: blueprints-blackshome
      mountPath: /config/blueprints/automation/Blackshome/sensor-light.yaml
      subPath: sensor-light.yaml
      readOnly: true
    - name: blueprints-homeassistant
      mountPath: /config/blueprints/automation/homeassistant/motion_light.yaml
      subPath: motion_light.yaml
      readOnly: true
    - name: zigbee
      mountPath: /dev/ttyUSB0

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    tls:
      - secretName: homeassistant-homelab-tls
        hosts:
          - homeassistant-k8s.home.lab
    hosts:
      - host: homeassistant-k8s.home.lab
        paths:
          - path: /
            pathType: Prefix
