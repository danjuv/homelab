fullnameOverride: open-webui

# Use the application version shipped with the pinned Helm chart.
# The standard image includes the local document-embedding dependencies.
image:
  useSlim: false

# One writer for SQLite, the local vector store, and the Longhorn RWO volume.
workload:
  kind: Deployment
replicaCount: 1
strategy:
  type: Recreate

ollama:
  enabled: false
pipelines:
  enabled: false
tika:
  enabled: false
terminals:
  enabled: false

websocket:
  enabled: true
  manager: ""
  redis:
    enabled: false

# Enter the provider key in Admin Panel -> Settings -> Connections after setup.
# Open WebUI persists that connection in its database on the data volume.
enableOpenaiApi: true
openaiBaseApiUrl: https://openrouter.ai/api/v1
openaiApiKey: ""

extraEnvVars:
  - name: WEBUI_AUTH
    value: "True"
  - name: ENABLE_SIGNUP
    value: "True"
  - name: DEFAULT_USER_ROLE
    value: pending
  # The entrypoint generates the signing key once; keep it across pod replacement.
  - name: WEBUI_SECRET_KEY_FILE
    value: /app/backend/data/.webui_secret_key
  - name: WEBUI_SESSION_COOKIE_SECURE
    value: "True"
  - name: CORS_ALLOW_ORIGIN
    value: https://chat.home.lab

ingress:
  enabled: true
  class: nginx
  host: chat.home.lab
  tls: true
  existingSecret: open-webui-homelab-tls
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

persistence:
  enabled: true
  storageClass: longhorn
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

serviceAccount:
  automountServiceAccountToken: false

# Short-lived, kubelet-rotated token for open-webui-sa. The OpenCode Tasks tool
# (installed in the admin panel) sends it to the Argo Server to run OpenCode tasks
# (Role: k8s/apps/opencode/rbac.yaml). The default token stays unmounted.
volumes:
  - name: argo-workflows-token
    projected:
      defaultMode: 0440
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
volumeMounts:
  container:
    - name: argo-workflows-token
      mountPath: /var/run/secrets/argo-workflows
      readOnly: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Allow time for first-start migrations and local embedding model loading.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /health/db
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
copyAppData:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

extraResources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: open-webui
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: open-webui
          app.kubernetes.io/component: open-webui
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: ingress-nginx
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress-nginx
                  app.kubernetes.io/component: controller
          ports:
            - protocol: TCP
              port: 8080
