# kubeopencode controller: runs OpenCode Tasks as pods (see k8s/apps/opencode).
controller:
  image:
    # Chart appVersion, pinned by digest.
    tag: v0.1.9@sha256:8517fc01a7692b4c6be0f1d42e6c6ebb6f306fc66b86b188ff5298fbba6b3141
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

# The web UI/API server is not used yet (tasks are created with kubectl). Its
# ClusterRole includes pods/exec, so leave it off until there is a front end.
server:
  enabled: false

# Managed in kubeopencodeconfig.yaml: the chart can't set cleanup, and an
# empty systemImage makes the controller fall back to an unpinned :latest.
kubeopencodeConfig:
  create: false
