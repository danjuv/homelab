controllers:
  main:
    containers:
      main:
        image:
          repository: qbittorrentofficial/qbittorrent-nox
          tag: 5.1.4-2
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: "Australia/Sydney"
          QBT_LEGAL_NOTICE: "confirm"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              periodSeconds: 30
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              periodSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              periodSeconds: 5
              failureThreshold: 30

service:
  main:
    controller: main
    ports:
      http:
        port: 8080
  bittorrent:
    controller: main
    type: LoadBalancer
    ports:
      bittorrent-tcp:
        port: 6881
        protocol: TCP
      bittorrent-udp:
        port: 6881
        protocol: UDP

ingress:
  main:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    tls:
      - secretName: qbittorrent-homelab-tls
        hosts:
          - qbt.home.lab
    hosts:
      - host: qbt.home.lab
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 3Gi
    storageClass: longhorn
    globalMounts:
      - path: /config
  downloads:
    type: persistentVolumeClaim
    existingClaim: nfs-downloads
    globalMounts:
      - path: /downloads
