fullnameOverride: hermes

image:
  repository: nousresearch/hermes-agent
  # This chart appends :tag and has no separate digest setting.
  tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7

# Kubernetes replaces the image's root-only s6 supervisor.
command:
  - /opt/hermes/.venv/bin/hermes
args:
  - gateway
  - run
  - --no-supervise
  - --external-supervisor
workingDir: /opt/data

replicaCount: 1
strategy:
  type: Recreate

config:
  values:
    model:
      provider: openrouter
      default: anthropic/claude-opus-4.6
      base_url: https://openrouter.ai/api/v1
    terminal:
      cwd: /opt/data
    dashboard:
      public_url: https://hermes.home.lab
      # k3s uses this pod CIDR by default; nginx peers are restricted below.
      trusted_proxies:
        - 10.42.0.0/16
    # Argo Workflows (k8s/apps/opencode/hermes-notify.yaml)
    # POST finished-task messages here; delivered to Telegram as-is, no agent
    # turn. Signed with WEBHOOK_SECRET (hermes-webhook.sealed.yaml).
    platforms:
      webhook:
        enabled: true
        extra:
          routes:
            workflow-done:
              deliver: telegram
              deliver_only: true
              prompt: "{message}"
    # Same MCP servers as Open WebUI (configured in its admin panel).
    mcp_servers:
      # Seerr search and requests (k8s/apps/overseerr-mcp). Its proxy refuses
      # approve/decline/delete.
      seerr:
        url: http://overseerr-mcp.overseerr-mcp.svc.cluster.local:8085/mcp
      # Read-only cluster view, Secrets denied (k8s/apps/kubernetes-mcp-server).
      kubernetes:
        url: http://kubernetes-mcp-server.kubernetes-mcp-server.svc.cluster.local:8080/mcp
      # Hindsight memory, "homelab" tenant (k8s/apps/hindsight).
      # Tokens come from hermes-mcp.sealed.yaml (tools/seal_hermes_mcp.sh).
      hindsight:
        url: http://hindsight-api.hindsight.svc.cluster.local:8888/mcp/homelab/
        headers:
          Authorization: "Bearer ${HINDSIGHT_API_KEY}"
      github:
        url: https://api.githubcopilot.com/mcp/readonly
        headers:
          Authorization: "Bearer ${GITHUB_MCP_TOKEN}"

secrets:
  existingSecret: hermes-secrets
extraEnvFrom:
  - secretRef:
      name: hermes-webhook
  # Optional so the pod still starts before the SealedSecret exists.
  - secretRef:
      name: hermes-mcp
      optional: true

# Increment with SealedSecret changes to reload credentials through GitOps.
podAnnotations:
  hermes.home.lab/credentials-revision: "3"

apiServer:
  enabled: true
  host: 0.0.0.0
  port: 8642
  modelName: hermes-agent

webhook:
  enabled: true
  port: 8644

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: api-server
      port: 8642
      targetPort: 8642
      containerPort: 8642
    - name: dashboard
      port: 9119
      targetPort: 9119
      containerPort: 9119
    - name: webhook
      port: 8644
      targetPort: 8644
      containerPort: 8644

ingress:
  enabled: true
  className: nginx
  servicePortNumber: 9119
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: hermes.home.lab
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hermes-homelab-tls
      hosts:
        - hermes.home.lab

# nginx can reach only the dashboard; workflow pods only the webhook. The API
# remains port-forward-only.
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 9119
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode
      ports:
        - protocol: TCP
          port: 8644

# Debitsuccess login for the invoice cron script, as read-only files
# (cron scripts get a scrubbed env, so credentials can't come from env vars).
extraVolumes:
  - name: debitsuccess-credentials
    secret:
      secretName: debitsuccess-credentials
      defaultMode: 0440
      optional: true
  # Short-lived, kubelet-rotated token for the hermes ServiceAccount. The
  # opencode skill sends it to the Argo Server to run OpenCode tasks
  # (Role: k8s/apps/opencode/rbac.yaml). The default token stays unmounted.
  - name: argo-workflows-token
    projected:
      defaultMode: 0440
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
extraVolumeMounts:
  - name: debitsuccess-credentials
    mountPath: /var/run/secrets/debitsuccess
    readOnly: true
  - name: argo-workflows-token
    mountPath: /var/run/secrets/argo-workflows
    readOnly: true

# The dashboard/remote Desktop backend shares the gateway's persistent state.
# Keep this image aligned with image.repository/image.tag above.
extraContainers:
  - name: dashboard
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    imagePullPolicy: IfNotPresent
    command:
      - /opt/hermes/.venv/bin/hermes
    args:
      - dashboard
      - --host
      - 0.0.0.0
      - --port
      - "9119"
      - --no-open
      - --skip-build
    workingDir: /opt/data
    env:
      - name: HERMES_HOME
        value: /opt/data
      - name: HOME
        value: /opt/data/home
      # Containers have separate PID namespaces; detect the gateway over HTTP.
      - name: GATEWAY_HEALTH_URL
        value: http://127.0.0.1:8642
      - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        value: admin
      - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
    envFrom:
      - secretRef:
          name: hermes-secrets
      # Dashboard chat connects to MCP servers itself; it needs the same tokens.
      - secretRef:
          name: hermes-mcp
          optional: true
    startupProbe:
      httpGet:
        path: /api/status
        port: 9119
        httpHeaders:
          - name: Host
            value: hermes.home.lab
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /api/status
        port: 9119
        httpHeaders:
          - name: Host
            value: hermes.home.lab
      periodSeconds: 10
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /api/status
        port: 9119
        httpHeaders:
          - name: Host
            value: hermes.home.lab
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
    volumeMounts:
      - name: data
        mountPath: /opt/data
      - name: tmp
        mountPath: /tmp

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

serviceAccount:
  automountServiceAccountToken: false
rbac:
  create: false

podSecurityContext:
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  runAsNonRoot: true

probes:
  startup:
    httpGet:
      path: /health
      port: api-server
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    httpGet:
      path: /health
      port: api-server
    periodSeconds: 10
    timeoutSeconds: 3
  liveness:
    httpGet:
      path: /health
      port: api-server
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
