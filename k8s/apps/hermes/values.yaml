fullnameOverride: hermes

image:
  repository: nousresearch/hermes-agent
  # This chart appends :tag and has no separate digest setting.
  tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7

# Kubernetes replaces the image's root-only s6 supervisor.
command:
  - /opt/hermes/.venv/bin/hermes
args:
  - gateway
  - run
  - --no-supervise
  - --external-supervisor
workingDir: /opt/data

replicaCount: 1
strategy:
  type: Recreate

config:
  values:
    model:
      provider: openrouter
      default: anthropic/claude-opus-4.6
      base_url: https://openrouter.ai/api/v1
    terminal:
      cwd: /opt/data
    dashboard:
      public_url: https://hermes.home.lab
      # k3s uses this pod CIDR by default; nginx peers are restricted below.
      trusted_proxies:
        - 10.42.0.0/16

secrets:
  existingSecret: hermes-secrets

# Increment with SealedSecret changes to reload credentials through GitOps.
podAnnotations:
  hermes.home.lab/credentials-revision: "2"

apiServer:
  enabled: true
  host: 0.0.0.0
  port: 8642
  modelName: hermes-agent

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: api-server
      port: 8642
      targetPort: 8642
      containerPort: 8642
    - name: dashboard
      port: 9119
      targetPort: 9119
      containerPort: 9119

ingress:
  enabled: true
  className: nginx
  servicePortNumber: 9119
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: hermes.home.lab
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: hermes-homelab-tls
      hosts:
        - hermes.home.lab

# nginx can reach only the dashboard. The API remains port-forward-only.
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 9119

# Debitsuccess login for the invoice cron script, as read-only files
# (cron scripts get a scrubbed env, so credentials can't come from env vars).
extraVolumes:
  - name: debitsuccess-credentials
    secret:
      secretName: debitsuccess-credentials
      defaultMode: 0440
      optional: true
extraVolumeMounts:
  - name: debitsuccess-credentials
    mountPath: /var/run/secrets/debitsuccess
    readOnly: true

# The dashboard/remote Desktop backend shares the gateway's persistent state.
# Keep this image aligned with image.repository/image.tag above.
extraContainers:
  - name: dashboard
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    imagePullPolicy: IfNotPresent
    command:
      - /opt/hermes/.venv/bin/hermes
    args:
      - dashboard
      - --host
      - 0.0.0.0
      - --port
      - "9119"
      - --no-open
      - --skip-build
    workingDir: /opt/data
    env:
      - name: HERMES_HOME
        value: /opt/data
      - name: HOME
        value: /opt/data/home
      # Containers have separate PID namespaces; detect the gateway over HTTP.
      - name: GATEWAY_HEALTH_URL
        value: http://127.0.0.1:8642
      - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        value: admin
      - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        valueFrom:
          secretKeyRef:
            name: hermes-dashboard-auth
            key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
    envFrom:
      - secretRef:
          name: hermes-secrets
    startupProbe:
      httpGet:
        path: /api/status
        port: 9119
        httpHeaders:
          - name: Host
            value: hermes.home.lab
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /api/status
        port: 9119
        httpHeaders:
          - name: Host
            value: hermes.home.lab
      periodSeconds: 10
      timeoutSeconds: 3
    livenessProbe:
      httpGet:
        path: /api/status
        port: 9119
        httpHeaders:
          - name: Host
            value: hermes.home.lab
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
    volumeMounts:
      - name: data
        mountPath: /opt/data
      - name: tmp
        mountPath: /tmp

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

serviceAccount:
  automountServiceAccountToken: false
rbac:
  create: false

podSecurityContext:
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  runAsNonRoot: true

probes:
  startup:
    httpGet:
      path: /health
      port: api-server
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    httpGet:
      path: /health
      port: api-server
    periodSeconds: 10
    timeoutSeconds: 3
  liveness:
    httpGet:
      path: /health
      port: api-server
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
