# Script for the Hermes "Debitsuccess tax invoice" cron job (no-agent mode).
# Mounted at /opt/data/scripts/debitsuccess/ in the hermes-agent container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-debitsuccess-script
  namespace: hermes
data:
  debitsuccess_invoice.py: |
    """Download new Debitsuccess tax invoices for a Hermes no-agent cron job.

    Logs in to the Debitsuccess customer portal the same way its web app does
    (OpenID Connect implicit flow against CustomerIdentity), then calls the
    portal's JSON API to list tax invoices and fetch new ones as PDFs.

    stdout is delivered verbatim by Hermes. Each new invoice prints a short
    message plus a MEDIA:<path> line, which Hermes sends as an attachment.
    No new invoices -> empty stdout -> silent run. Errors exit non-zero, which
    Hermes reports as a failed job.

    The first run delivers only the latest invoice per account and marks older
    ones as already seen.

    Flags (for manual runs):
      --dry-run   list invoices; download nothing; leave state untouched
      --latest    re-deliver the latest invoice per account, even if seen
    """

    import argparse
    import html
    import json
    import os
    import re
    import secrets
    import sys
    import tempfile
    from datetime import date
    from pathlib import Path
    from urllib.parse import parse_qs, urljoin, urlparse

    import requests

    BASE = "https://oc.debitsuccess.com"
    IDENTITY = f"{BASE}/CustomerIdentity"
    PORTAL = f"{BASE}/CustomerPortal"
    REDIRECT_URI = f"{PORTAL}/LoginCallback"
    CLIENT_ID = "CustomerPortal"
    SCOPE = "openid profile CustomerPortalApi IdentityServerApi"

    CREDENTIALS_DIR = Path(
        os.environ.get("DEBITSUCCESS_CREDENTIALS_DIR", "/var/run/secrets/debitsuccess")
    )
    OUTPUT_DIR = Path(
        os.environ.get("DEBITSUCCESS_OUTPUT_DIR", "/opt/data/documents/debitsuccess")
    )
    STATE_FILE = OUTPUT_DIR / "state.json"
    TIMEOUT = 30
    USER_AGENT = (
        "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
        "(KHTML, like Gecko) Chrome/140.0 Safari/537.36"
    )


    class FetchError(Exception):
        pass


    def read_credential(name: str) -> str:
        path = CREDENTIALS_DIR / name
        try:
            value = path.read_text().strip()
        except OSError as exc:
            raise FetchError(f"cannot read credential file {path}: {exc.strerror}") from None
        if not value:
            raise FetchError(f"credential file {path} is empty")
        return value


    def parse_attrs(tag: str) -> dict:
        return {
            k.lower(): html.unescape(v)
            for k, v in re.findall(r'([\w:-]+)\s*=\s*"([^"]*)"', tag)
        }


    def login(session: requests.Session, username: str, password: str) -> str:
        """Return an access token for the portal API."""
        state = secrets.token_urlsafe(16)
        params = {
            "client_id": CLIENT_ID,
            "redirect_uri": REDIRECT_URI,
            "response_type": "id_token token",
            "scope": SCOPE,
            "state": state,
            "nonce": secrets.token_urlsafe(16),
        }
        page = session.get(f"{IDENTITY}/connect/authorize", params=params, timeout=TIMEOUT)
        page.raise_for_status()

        form = re.search(r"<form\b([^>]*)>(.*?)</form>", page.text, re.S | re.I)
        if not form:
            raise FetchError(f"login form not found at {page.url}")
        action = parse_attrs(form.group(1)).get("action") or page.url
        fields = {}
        for tag in re.findall(r"<input\b[^>]*>", form.group(2), re.I):
            attrs = parse_attrs(tag)
            if attrs.get("name"):
                fields[attrs["name"]] = attrs.get("value", "")
        if "Username" not in fields or "Password" not in fields:
            raise FetchError("login form layout changed (Username/Password fields missing)")
        fields["Username"] = username
        fields["Password"] = password

        response = session.post(
            urljoin(page.url, action), data=fields, allow_redirects=False, timeout=TIMEOUT
        )
        for _ in range(10):
            if not response.is_redirect:
                break
            location = urljoin(response.url, response.headers["Location"])
            if location.startswith(REDIRECT_URI):
                result = {k: v[0] for k, v in parse_qs(urlparse(location).fragment).items()}
                if "error" in result:
                    raise FetchError(f"login rejected: {result['error']}")
                if result.get("state") != state or "access_token" not in result:
                    raise FetchError("login callback missing access token")
                return result["access_token"]
            response = session.get(location, allow_redirects=False, timeout=TIMEOUT)

        # Still on the login page: surface the portal's own validation message.
        messages = re.findall(
            r'class="[^"]*(?:validation-summary|text-danger|alert)[^"]*"[^>]*>(.*?)</',
            response.text,
            re.S | re.I,
        )
        detail = " ".join(
            " ".join(html.unescape(re.sub(r"<[^>]+>", " ", m)).split()) for m in messages
        ).strip()
        raise FetchError(f"login failed (HTTP {response.status_code}){': ' + detail if detail else ''}")


    def api_get(session: requests.Session, token: str, path: str, accept: str = "application/json"):
        response = session.get(
            f"{PORTAL}/api/{path}",
            headers={"Authorization": f"Bearer {token}", "Accept": accept},
            timeout=60,
        )
        if not response.ok:
            raise FetchError(f"GET api/{path.split('?')[0]} returned HTTP {response.status_code}")
        return response


    def find_invoices(payload):
        """The invoice list is nested in the response; find the list of dicts with startPeriod."""
        if isinstance(payload, list):
            if payload and all(isinstance(i, dict) and "startPeriod" in i for i in payload):
                return payload
            for item in payload:
                found = find_invoices(item)
                if found is not None:
                    return found
        elif isinstance(payload, dict):
            for value in payload.values():
                found = find_invoices(value)
                if found is not None:
                    return found
        return None


    def load_state() -> dict | None:
        try:
            return json.loads(STATE_FILE.read_text())
        except FileNotFoundError:
            return None


    def save_state(state: dict) -> None:
        OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
        with tempfile.NamedTemporaryFile("w", dir=OUTPUT_DIR, delete=False) as tmp:
            json.dump(state, tmp, indent=2, sort_keys=True)
        os.replace(tmp.name, STATE_FILE)


    def describe(invoice: dict) -> str:
        start = date.fromisoformat(invoice["startPeriod"][:10])
        text = start.strftime("%B %Y")
        if invoice.get("endPeriod"):
            end = date.fromisoformat(invoice["endPeriod"][:10])
            text += f" ({start:%d %b %Y} - {end:%d %b %Y})"
        return text


    def merchant_name(account: dict) -> str:
        """Best-effort business name (the gym) from the account record."""
        for key, value in account.items():
            if isinstance(value, str) and value.strip() and re.search(
                r"(client|business|merchant|club|company).*name", key, re.I
            ):
                return value.strip()
        return "Debitsuccess"


    def money_fields(invoice: dict) -> list[str]:
        """Best-effort amount/GST lines from the invoice record (field names not documented)."""
        lines = []
        for key, value in invoice.items():
            if isinstance(value, bool) or not isinstance(value, (int, float, str)):
                continue
            if not re.search(r"amount|total|gst|tax|price", key, re.I):
                continue
            try:
                number = float(value)
            except ValueError:
                continue
            label = re.sub(r"(?<!^)(?=[A-Z])", " ", key).lower()
            lines.append(f"- {label}: ${number:,.2f}")
        return lines


    def claim_message(account: dict, invoice: dict, path: Path) -> str:
        start = date.fromisoformat(invoice["startPeriod"][:10])
        lines = [
            f"New gym membership tax invoice: {describe(invoice)}",
            "",
            "Airwallex reimbursement details:",
            f"- merchant: {merchant_name(account)}",
            f"- date: {start:%d %b %Y}",
            *money_fields(invoice),
            f"- description: Gym membership {start:%b %Y}",
            "",
            f"MEDIA:{path}",
        ]
        return "\n".join(lines)


    def main() -> int:
        parser = argparse.ArgumentParser(description=__doc__.splitlines()[0])
        parser.add_argument("--dry-run", action="store_true")
        parser.add_argument("--latest", action="store_true")
        args = parser.parse_args()

        session = requests.Session()
        session.headers["User-Agent"] = USER_AGENT
        token = login(session, read_credential("username"), read_credential("password"))

        accounts = api_get(session, token, "user/accounts").json() or []
        active = [a for a in accounts if a.get("isActive") or a.get("isSuspended")] or accounts
        if not active:
            raise FetchError("no accounts linked to this login")

        state = load_state()
        first_run = state is None
        state = state or {"seen": {}}
        messages = []

        for account in active:
            adfit = str(account["adfitNo"])
            payload = api_get(session, token, f"accounts/{adfit}/taxinvoices").json()
            invoices = find_invoices(payload)
            if invoices is None:
                shape = sorted(payload) if isinstance(payload, dict) else type(payload).__name__
                raise FetchError(f"unexpected tax invoice response for account {adfit}: {shape}")
            invoices.sort(key=lambda i: i["startPeriod"])
            seen = set(state["seen"].get(adfit, []))

            if args.dry_run:
                print(f"account {adfit} fields: {json.dumps(account, default=str)}")
                for inv in invoices:
                    period = inv["startPeriod"][:10]
                    mark = "seen" if period in seen else "new"
                    print(f"{adfit} {period} {describe(inv)} [{mark}]")
                if invoices:
                    print(f"latest invoice fields: {json.dumps(invoices[-1], default=str)}")
                continue

            if args.latest or first_run:
                wanted = invoices[-1:]
                seen.update(i["startPeriod"][:10] for i in invoices)
            else:
                wanted = [i for i in invoices if i["startPeriod"][:10] not in seen]

            for inv in wanted:
                period = inv["startPeriod"][:10]
                pdf = api_get(
                    session,
                    token,
                    f"accounts/{adfit}/taxinvoices/aspdf/?periodStart={period}",
                    accept="application/pdf",
                ).content
                if not pdf.startswith(b"%PDF"):
                    raise FetchError(f"invoice {period} for account {adfit} is not a PDF")
                OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
                path = OUTPUT_DIR / f"debitsuccess-tax-invoice-{adfit}-{period[:7]}.pdf"
                path.write_bytes(pdf)
                seen.add(period)
                messages.append(claim_message(account, inv, path))

            state["seen"][adfit] = sorted(seen)

        if not args.dry_run:
            save_state(state)
        print("\n\n".join(messages))
        return 0


    if __name__ == "__main__":
        try:
            sys.exit(main())
        except (FetchError, requests.RequestException) as exc:
            print(f"Debitsuccess invoice fetch failed: {exc}", file=sys.stderr)
            sys.exit(1)
