# Blueprint for ephemeral coding Tasks: each Task gets its own pod and a fresh
# clone of this repo, then pushes a branch and opens a PR. Run one with:
#
#   kubectl create -f - <<EOF
#   apiVersion: kubeopencode.io/v1alpha1
#   kind: Task
#   metadata:
#     generateName: homelab-
#     namespace: opencode
#   spec:
#     templateRef:
#       name: homelab
#     timeout: 45m
#     description: |
#       <self-contained task brief>
#   EOF
apiVersion: kubeopencode.io/v1alpha1
kind: AgentTemplate
metadata:
  name: homelab
  namespace: opencode
  annotations:
    # The CRD is installed by the kubeopencode app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Both built by //images/opencode (same layers and OpenCode version).
  # agentImage copies the binary to /tools; executorImage runs it.
  agentImage: ghcr.io/danjuv/opencode-init:1.18.35@sha256:f5d93d845e7ea2344c3b6dbc458a4332e051b42c3a4975bd351fcc309001df29
  executorImage: ghcr.io/danjuv/opencode:1.18.35@sha256:057549c5861a6026f5dbbde25311da5fc7e9ae1a798b038e275be97f9947d897
  serviceAccountName: opencode-agent
  workspaceDir: /workspace

  contexts:
    # mountPath "." clones into the workspace root, so OpenCode runs in the repo.
    - name: homelab
      type: Git
      mountPath: .
      git:
        repository: https://github.com/danjuv/homelab.git
        ref: main
        secretRef:
          name: opencode-secrets # keys: username, password
    - name: platform
      type: Runtime

  credentials:
    - name: openrouter
      secretRef:
        name: opencode-secrets
        key: OPENROUTER_API_KEY
      env: OPENROUTER_API_KEY
    - name: github
      secretRef:
        name: opencode-secrets
        key: password
      env: GH_TOKEN

  config:
    $schema: https://opencode.ai/config.json
    model: openrouter/anthropic/claude-opus-5.5
    autoupdate: false
    share: disabled
    instructions:
      - /etc/opencode-agent/AGENTS.md
    # Unattended: "ask" would block forever, so every rule is allow or deny.
    permission:
      "*": allow
      question: deny
      doom_loop: deny
      external_directory:
        "*": deny
        "/tmp/**": allow
        "/etc/opencode-agent/**": allow
      bash:
        "*": allow
        "git push * main": deny
        "git push * main:*": deny
        "git push * HEAD:main": deny
        "git push *--force*": deny
        "git push * -f*": deny
        "gh pr merge*": deny
        "gh repo delete*": deny
        "gh api *": deny
        "kubeseal*": deny

  podSpec:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
      fsGroup: 10000
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 6Gi
    extraVolumes:
      - name: agent-files
        configMap:
          name: opencode-agent
    # Agent container only; git-init keeps its own git config.
    extraVolumeMounts:
      - name: agent-files
        mountPath: /etc/opencode-agent
        readOnly: true
      - name: agent-files
        mountPath: /tmp/.gitconfig
        subPath: gitconfig
        readOnly: true
