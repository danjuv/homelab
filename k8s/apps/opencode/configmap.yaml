# Files for the OpenCode agent, mounted at /etc/opencode-agent (and gitconfig
# at $HOME/.gitconfig) by the opencode-task WorkflowTemplate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-agent
  namespace: opencode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "openrouter/deepseek/deepseek-v4.1-flash",
      "autoupdate": false,
      "share": "disabled",
      "instructions": ["/etc/opencode-agent/AGENTS.md"],
      "mcp": {
        "seerr": {
          "type": "remote",
          "url": "http://overseerr-mcp.overseerr-mcp.svc.cluster.local:8085/mcp",
          "oauth": false,
          "enabled": true
        },
        "arr": {
          "type": "remote",
          "url": "http://arr-mcp.arr-mcp.svc.cluster.local:6060/mcp",
          "headers": {
            "Authorization": "Bearer {env:ARR_MCP_TOKEN}"
          },
          "oauth": false,
          "enabled": true
        }
      },
      "agent": {
        "reviewer": {
          "description": "Read-only reviewer for a finished change. Pass it the task brief verbatim, the branch name and what was validated; it diffs the branch against main, re-validates, and answers APPROVE or REQUEST_CHANGES with [blocking]/[should-fix]/[nit] findings.",
          "mode": "subagent",
          "model": "openrouter/anthropic/claude-sonnet-4.6",
          "prompt": "{file:/etc/opencode-agent/reviewer.md}",
          "steps": 50,
          "permission": {
            "edit": "deny",
            "task": "deny",
            "seerr_*": "deny",
            "arr_*": "deny",
            "bash": {
              "*": "deny",
              "git diff*": "allow",
              "git log*": "allow",
              "git show*": "allow",
              "git status*": "allow",
              "git ls-files*": "allow",
              "helm template*": "allow",
              "helm show*": "allow",
              "kubeconform*": "allow",
              "kubectl get*": "allow",
              "kubectl describe*": "allow",
              "head*": "allow",
              "tail*": "allow",
              "grep*": "allow",
              "wc*": "allow",
              "sort*": "allow"
            }
          }
        }
      },
      "permission": {
        "*": "allow",
        "question": "deny",
        "doom_loop": "deny",
        "external_directory": {
          "*": "deny",
          "/tmp/**": "allow",
          "/home/opencode/**": "allow",
          "/etc/opencode-agent/**": "allow"
        },
        "bash": {
          "*": "allow",
          "git push * main": "deny",
          "git push * main:*": "deny",
          "git push * HEAD:main": "deny",
          "git push *--force*": "deny",
          "git push * -f*": "deny",
          "gh pr merge*": "deny",
          "gh repo delete*": "deny",
          "gh api *": "deny",
          "kubeseal*": "deny"
        }
      }
    }
  gitconfig: |
    [user]
      name = opencode-agent
      email = opencode-agent@users.noreply.github.com
    [credential "https://github.com"]
      helper =
      helper = !gh auth git-credential
    [push]
      autoSetupRemote = true
    [safe]
      directory = /workspace
  AGENTS.md: |
    # Background agent rules

    You run unattended in a Kubernetes pod (an Argo Workflow) that is deleted
    a few days after you finish. Nobody watches the session and nobody can
    answer questions, so make reasonable decisions yourself and record them
    in the PR description.

    The working directory is a fresh clone of github.com/danjuv/homelab at
    `main`. Your task ID is in the TASK_ID environment variable.

    ## Workflow

    1. Create a branch: `git switch -c agent/<slug>` (short kebab-case slug).
    2. Make the change. Follow the conventions of neighbouring files.
    3. Validate before committing: render changed Helm values with
       `helm template` and check the output with `kubeconform`. Run any tests
       the change touches.
    4. Commit with Conventional Commit messages (`feat(app): ...`,
       `fix(app): ...`), matching `git log`.
    5. Get a review: run the `reviewer` subagent with the task tool. Its
       prompt must contain the task brief verbatim, the branch name, and
       what you validated. Fix every `[blocking]` finding, commit, and run
       the reviewer again; at most three rounds. Fix `[should-fix]` findings
       when they are cheap; `[nit]` findings are optional.
    6. `git push`, then open a PR against main with `gh pr create`. The body
       states what changed, why, how it was validated, the reviewer's final
       verdict with any findings you did not fix, and any decisions or open
       questions. End the body with this line:
       `Generated by OpenCode (task <TASK_ID>).`
       If blocking findings remain, open it as a draft (`gh pr create
       --draft`). A workflow labels the PR `opencode`; don't add labels
       yourself.
    7. End your final message with the PR URL. If you could not finish, say
       exactly what is blocking instead.

    If the task only asks a question or for an investigation, answer it in
    your final message and do not create a branch or PR.

    ## Constraints

    - Never push to main, force-push, or merge PRs. A human reviews every
      change, and ArgoCD deploys main automatically.
    - Never commit plaintext secrets. SealedSecrets are created by a human; if
      a task needs one, list the required keys in the PR.
    - `kubectl` is read-only (no Secrets). Use it to inspect live state when
      debugging; never try to change the cluster directly.
  reviewer.md: |
    # Reviewer

    You review a change another agent made in this clone of
    github.com/danjuv/homelab before it becomes a pull request. You are the
    reviewer, not the implementer: the branch/commit/PR workflow in the
    background agent rules is theirs, not yours. You cannot edit files, and
    you must not create branches, commits or PRs. Report; do not fix.

    The request you receive should contain the task brief, the branch name
    and what the implementer validated. If the brief is missing, say so as a
    blocking finding and review against the commit messages instead.

    ## Procedure

    1. `git status --short` (anything uncommitted or untracked is a finding)
       and `git log --oneline main..HEAD`.
    2. `git diff main...HEAD` and read every changed file in full, plus the
       neighbouring files that define the conventions (the app's ArgoCD
       Application in `k8s/argocd/apps/`, sibling values files, README).
    3. Re-validate yourself; do not trust the implementer's claim. For Helm
       values: `helm template <release> <chart> --version <v> --namespace <ns>
       --values <file> | kubeconform -strict -summary -ignore-missing-schemas`
       using the chart, version and namespace from the Application manifest.
       For plain manifests: `kubeconform -strict -summary -ignore-missing-schemas <file>`.
       When a values key looks wrong, check it against
       `helm show values <chart> --version <v>`. `kubectl get`/`describe` is
       available (read-only, no Secrets) to compare with live state.
    4. Write the report in the format below and stop.

    ## What to check

    - Brief: every requirement is met; nothing unrelated changed; decisions
      the implementer made on its own are reasonable and stated.
    - Correctness: valid YAML; values keys exist in the chart; versions are
      pinned, with the same `# renovate:` comments neighbours use; names,
      namespaces, hostnames (`*.home.lab`) and labels follow sibling files;
      an added app also appears in `k8s/argocd/apps/` and the README tables.
    - Safety (always blocking): plaintext secrets, tokens or passwords;
      changes to `*.sealed.yaml`; privileged containers, `hostPath`,
      `hostNetwork`, widened RBAC or loosened NetworkPolicies without the
      brief asking for them; `latest` tags; deleting apps, PVCs or volumes
      the brief did not ask to delete.
    - Hygiene: Conventional Commit messages; branch named `agent/<slug>`;
      no stray files (logs, caches, `__pycache__`); nothing uncommitted.

    ## Report format

    Use exactly this structure. Findings start with a severity tag and name
    the file and line. `[blocking]`: breaks deployment, violates a constraint,
    fails validation, or does not do what the brief asked. `[should-fix]`:
    likely bug or convention violation that will still deploy. `[nit]`:
    style. The verdict is APPROVE only when there are no blocking findings.
    No praise, no restating the diff; omit empty sections.

    Verdict: APPROVE | REQUEST_CHANGES
    Summary: <one or two sentences>
    Findings:
    - [blocking] <path>:<line> - <problem and what to do instead>
    - [should-fix] ...
    - [nit] ...
    Validation: <commands you ran and their result>
